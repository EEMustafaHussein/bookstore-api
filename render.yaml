# Render Blueprint for the "ملابس الأحلام" store (dreams-store/).
# Render → New → Blueprint → pick this repository. Step-by-step guide: dreams-store/README.md.
#
# Free setup: the site runs on Render's free plan, and products, orders and photos are kept
# in a free PostgreSQL database from neon.tech (files on a free Render service are wiped on
# every restart). For a paid plan with a disk instead, set plan: starter, add a disk mounted at
# /var/data, DATABASE_URL=sqlite:////var/data/dreams.db, MEDIA_STORAGE=disk, MEDIA_DIR=/var/data/media.
services:
  - type: web
    name: dreams-store
    runtime: python
    rootDir: dreams-store
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /robots.txt
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: MEDIA_STORAGE
        value: database
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYMENT_DEMO_MODE
        value: "false"
      # Asked for when the Blueprint is created:
      # the Neon connection link (postgresql://...), and the owner account made on first start.
      - key: DATABASE_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
